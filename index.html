<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自製教學工具：面積逼近圓周率</title>
    <style>
        :root {
            --primary-color: #0071e3;
            --bg-color: #f5f5f7;
            --card-bg: #ffffff;
            --text-color: #1d1d1f;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 { font-weight: 600; font-size: 24px; margin-bottom: 10px; }
        p { color: #86868b; margin-bottom: 30px; }

        canvas {
            background: #fff;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            margin-bottom: 20px;
            max-width: 100%;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin-top: 10px;
        }

        .slider-box {
            width: 100%;
            max-width: 500px;
        }

        input[type=range] {
            width: 100%;
            height: 6px;
            background: #d2d2d7;
            border-radius: 5px;
            outline: none;
            -webkit-appearance: none;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: var(--primary-color);
            border-radius: 50%;
            cursor: pointer;
        }

        .stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 100%;
            margin-top: 20px;
        }

        .stat-card {
            background: #fbfbfd;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #d2d2d7;
        }

        .stat-label { font-size: 14px; color: #86868b; margin-bottom: 5px; }
        .stat-value { font-size: 24px; font-weight: bold; color: var(--primary-color); font-family: monospace; }
        
        .formula {
            margin-top: 30px;
            padding: 15px;
            background: #f5f5f7;
            border-radius: 10px;
            font-size: 14px;
            text-align: left;
            font-family: monospace;
            border-left: 4px solid var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>用面積逼近圓周率 (π)</h1>
        <p>調整多邊形的邊數，觀察面積如何接近 3.14159...</p>

        <canvas id="piCanvas" width="500" height="500"></canvas>

        <div class="controls">
            <div class="slider-box">
                <label for="nSlider">邊數 (n)：<span id="nValue">6</span></label>
                <input type="range" id="nSlider" min="3" max="200" value="6">
            </div>

            <div class="stats">
                <div class="stat-card">
                    <div class="stat-label">當前多邊形面積</div>
                    <div class="stat-value" id="areaValue">2.59808</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">圓周率 (π) 參考值</div>
                    <div class="stat-value">3.14159</div>
                </div>
            </div>
        </div>

        <div class="formula">
            <strong>Python 邏輯參考：</strong><br>
            import math<br>
            area = (n * r**2 * math.sin(2 * math.pi / n)) / 2
        </div>
    </div>

    <script>
        const canvas = document.getElementById('piCanvas');
        const ctx = canvas.getContext('2d');
        const slider = document.getElementById('nSlider');
        const nValue = document.getElementById('nValue');
        const areaValue = document.getElementById('areaValue');

        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 200;

        function draw() {
            const n = parseInt(slider.value);
            nValue.textContent = n;

            // 計算面積: Area = (n * r^2 * sin(2π/n)) / 2
            // 這裡假設單位圓 r = 1，所以結果直接就是 π 的近似值
            const area = (n * Math.sin((2 * Math.PI) / n)) / 2;
            areaValue.textContent = area.toFixed(5);

            // 清除畫布
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 繪製外接圓
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.strokeStyle = '#d2d2d7';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 繪製內接多邊形
            ctx.beginPath();
            for (let i = 0; i <= n; i++) {
                const angle = (i * 2 * Math.PI) / n - Math.PI / 2;
                const x = centerX + radius * Math.cos(angle);
                const y = centerY + radius * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            // 填充多邊形
            ctx.fillStyle = 'rgba(0, 113, 227, 0.2)';
            ctx.fill();
            
            // 描邊多邊形
            ctx.strokeStyle = '#0071e3';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';
            ctx.stroke();

            // 繪製中心點到頂點的連線 (輔助線)
            if (n <= 100) {
                ctx.beginPath();
                ctx.setLineDash([5, 5]);
                for (let i = 0; i < n; i++) {
                    const angle = (i * 2 * Math.PI) / n - Math.PI / 2;
                    ctx.moveTo(centerX, centerY);
                    ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
                }
                ctx.strokeStyle = '#86868b';
                ctx.lineWidth = 1;
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        slider.oninput = draw;
        
        // 初始繪圖
        draw();
    </script>
</body>
</html>
